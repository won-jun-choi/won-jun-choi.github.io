job_market_paper:
  title: Nonparametric Estimation and Inference in Affine Conditional Moment Restriction
    Models
  abstract: Conditional moment restriction (CMR) models provide a flexible framework
    for structural and reduced-form analysis. This paper develops a general framework
    for nonparametric estimation and inference in affine CMR models. We build on the
    sieve minimum distance framework, while allowing for modern machine learning methods
    in the first stage to accommodate flexible estimation of the conditional moment
    with many instrumental variables. We provide Wald statistic for testing smooth
    functionals, and provide Gaussian coupling of our sieve coefficients, which
    can be used for various inference problems.
